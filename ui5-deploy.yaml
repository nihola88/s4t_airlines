# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: s4tairlines.s4tairlines
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          destination: S4T_Horsa_HTTPS
          url: http://s4demo.horsa.it:44301
          client: '050'
        app:
          name: TEST_AIRLINES
          description: Airlines and Flights OData Test
          package: $TMP
          transport: $TMP
        exclude:
          - /test/
